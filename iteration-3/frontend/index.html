<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iteration 3 - Lambda + AgentCore with Memory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
    
    .header { padding: 1rem; background: #16213e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .header h1 { font-size: 1.2rem; }
    .header-controls { display: flex; gap: 1rem; align-items: center; }
    .user-info { font-size: 0.85rem; color: #888; }
    
    .main-container { flex: 1; display: flex; overflow: hidden; }
    
    .login-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    .login-container p { color: #888; }
    
    .sidebar { width: 280px; background: #16213e; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 1rem; color: #888; }
    .conversation-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .conversation-item { padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 6px; cursor: pointer; background: #0f3460; transition: background 0.2s; }
    .conversation-item:hover { background: #1a4a7a; }
    .conversation-item.active { background: #e94560; }
    .conversation-item .title { font-size: 0.9rem; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conversation-item .meta { font-size: 0.75rem; color: #888; }
    .no-conversations { padding: 1rem; color: #666; text-align: center; font-size: 0.9rem; }
    
    .chat-container { flex: 1; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; padding: 1rem; }
    .message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 8px; max-width: 80%; white-space: pre-wrap; }
    .message.user { background: #0f3460; margin-left: auto; }
    .message.assistant { background: #16213e; border: 1px solid #333; }
    
    .input-area { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #333; background: #16213e; }
    .input-area input { flex: 1; padding: 0.75rem; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; font-size: 1rem; }
    .input-area input:focus { outline: none; border-color: #e94560; }
    
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: #e94560; color: white; }
    .btn-primary:hover { background: #d63850; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Iteration 3: Lambda + AgentCore with Memory</h1>
    <div class="header-controls">
      <span id="userInfo" class="user-info"></span>
      <button id="authBtn" class="btn btn-primary" onclick="handleAuth()">Login</button>
    </div>
  </div>

  <div id="loginView" class="login-container">
    <h2>Welcome</h2>
    <p>Login with Cognito to chat with the agent</p>
    <button class="btn btn-primary" onclick="handleAuth()">Login with Cognito</button>
  </div>

  <div id="chatView" class="main-container" style="display: none;">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Conversations</h2>
        <button class="btn btn-primary" onclick="newConversation()">+ New</button>
      </div>
      <div id="conversationList" class="conversation-list">
        <div class="no-conversations">Loading...</div>
      </div>
    </div>

    <div class="chat-container">
      <div id="messages" class="messages">
        <div class="no-conversations">Select a conversation or start a new one</div>
      </div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION - Update after deploying infrastructure
    // ============================================================
    const CONFIG = {
      cognitoDomain: 'apigw-agentcore-<YOUR_ACCOUNT_ID>.auth.<YOUR_REGION>.amazoncognito.com',
      clientId: '<YOUR_CLIENT_ID>',
      redirectUri: 'http://localhost:8000',
      // API Gateway endpoint
      apiEndpoint: 'https://<YOUR_API_ID>.execute-api.<YOUR_REGION>.amazonaws.com/prod'
    };

    let idToken = null;
    let currentSessionId = null;
    let conversations = [];

    // ============================================================
    // AUTH
    // ============================================================
    function handleAuth() {
      if (idToken) {
        idToken = null;
        sessionStorage.clear();
        updateUI();
      } else {
        const authUrl = `https://${CONFIG.cognitoDomain}/oauth2/authorize?` +
          `client_id=${CONFIG.clientId}&response_type=code&scope=openid+profile+email&` +
          `redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}`;
        window.location.href = authUrl;
      }
    }

    async function exchangeCodeForTokens(code) {
      const tokenUrl = `https://${CONFIG.cognitoDomain}/oauth2/token`;
      const params = new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: CONFIG.clientId,
        code: code,
        redirect_uri: CONFIG.redirectUri
      });

      try {
        const response = await fetch(tokenUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });
        if (!response.ok) throw new Error('Token exchange failed');
        const tokens = await response.json();
        idToken = tokens.id_token;
        sessionStorage.setItem('idToken', idToken);
        window.history.replaceState({}, document.title, CONFIG.redirectUri);
        updateUI();
        loadConversations();
      } catch (error) {
        console.error('Token exchange error:', error);
        alert('Authentication failed');
      }
    }

    // ============================================================
    // API CALLS
    // ============================================================
    async function loadConversations() {
      const listEl = document.getElementById('conversationList');
      
      try {
        const response = await fetch(`${CONFIG.apiEndpoint}/api/conversations`, {
          headers: { 'Authorization': idToken }
        });
        
        if (response.status === 401) { handleAuth(); return; }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        conversations = data.conversations || [];
        renderConversationList();
      } catch (error) {
        console.error('Failed to load conversations:', error);
        listEl.innerHTML = '<div class="no-conversations">Failed to load</div>';
      }
    }

    async function loadMessages(sessionId) {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '<div class="no-conversations">Loading...</div>';
      
      try {
        const response = await fetch(`${CONFIG.apiEndpoint}/api/conversations/${encodeURIComponent(sessionId)}`, {
          headers: { 'Authorization': idToken }
        });
        
        if (response.status === 401) { handleAuth(); return; }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        currentSessionId = sessionId;
        renderMessages(data.messages || []);
        renderConversationList();
      } catch (error) {
        console.error('Failed to load messages:', error);
        messagesEl.innerHTML = '<div class="no-conversations">Failed to load</div>';
      }
    }

    function generateSessionId() {
      const uuid = crypto.randomUUID();
      const timestamp = Date.now().toString(36);
      return `session-${uuid}-${timestamp}`;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message || !idToken) return;

      if (!currentSessionId) {
        currentSessionId = generateSessionId();
      }

      input.value = '';
      addMessageToUI(message, 'user');

      try {
        const response = await fetch(`${CONFIG.apiEndpoint}/api/chat`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': idToken
          },
          body: JSON.stringify({ message, session_id: currentSessionId })
        });

        if (response.status === 401) { handleAuth(); return; }
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);

        const data = await response.json();
        addMessageToUI(data.response, 'assistant');
        
        // Refresh conversation list to show new/updated conversation
        setTimeout(loadConversations, 1000);
        
      } catch (error) {
        console.error('Chat error:', error);
        addMessageToUI(`Error: ${error.message}`, 'assistant');
      }
    }

    // ============================================================
    // UI
    // ============================================================
    function renderConversationList() {
      const listEl = document.getElementById('conversationList');
      
      if (conversations.length === 0) {
        listEl.innerHTML = '<div class="no-conversations">No conversations yet</div>';
        return;
      }

      listEl.innerHTML = '';
      conversations.forEach(conv => {
        const isActive = conv.session_id === currentSessionId;
        const date = conv.created_at ? new Date(conv.created_at).toLocaleDateString() : '';
        
        const div = document.createElement('div');
        div.className = `conversation-item ${isActive ? 'active' : ''}`;
        div.onclick = () => loadMessages(conv.session_id);
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'title';
        titleDiv.textContent = conv.conversation_name || conv.session_id.substring(0, 20) + '...';
        
        const metaDiv = document.createElement('div');
        metaDiv.className = 'meta';
        metaDiv.textContent = date;
        
        div.appendChild(titleDiv);
        div.appendChild(metaDiv);
        listEl.appendChild(div);
      });
    }

    function renderMessages(messages) {
      const messagesEl = document.getElementById('messages');
      
      if (messages.length === 0) {
        messagesEl.innerHTML = '<div class="no-conversations">No messages</div>';
        return;
      }

      messagesEl.innerHTML = '';
      messages.forEach(msg => {
        const role = msg.role === 'human' ? 'user' : msg.role;
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = msg.content;
        messagesEl.appendChild(div);
      });
      
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessageToUI(text, type) {
      const messagesEl = document.getElementById('messages');
      const placeholder = messagesEl.querySelector('.no-conversations');
      if (placeholder) placeholder.remove();
      
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function newConversation() {
      currentSessionId = null;
      document.getElementById('messages').innerHTML = '<div class="no-conversations">Start typing</div>';
      renderConversationList();
      document.getElementById('messageInput').focus();
    }

    function updateUI() {
      const loginView = document.getElementById('loginView');
      const chatView = document.getElementById('chatView');
      const authBtn = document.getElementById('authBtn');
      const userInfo = document.getElementById('userInfo');

      if (idToken) {
        loginView.style.display = 'none';
        chatView.style.display = 'flex';
        authBtn.textContent = 'Logout';
        try {
          const payload = JSON.parse(atob(idToken.split('.')[1]));
          userInfo.textContent = payload.email || 'Logged in';
        } catch { userInfo.textContent = 'Logged in'; }
      } else {
        loginView.style.display = 'flex';
        chatView.style.display = 'none';
        authBtn.textContent = 'Login';
        userInfo.textContent = '';
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) { exchangeCodeForTokens(code); return; }
      idToken = sessionStorage.getItem('idToken');
      updateUI();
      if (idToken) loadConversations();
    }

    init();
  </script>
</body>
</html>
