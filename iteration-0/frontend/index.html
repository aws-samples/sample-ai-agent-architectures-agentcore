<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iteration 0 - AgentCore + Cognito</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 1rem; background: #16213e; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: #e94560; color: white; }
    .btn-secondary { background: #0f3460; color: white; }
    .container { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 1rem; }
    .messages { flex: 1; overflow-y: auto; padding: 1rem 0; }
    .message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 8px; max-width: 80%; }
    .message.user { background: #0f3460; margin-left: auto; }
    .message.assistant { background: #16213e; }
    .input-area { display: flex; gap: 0.5rem; padding-top: 1rem; border-top: 1px solid #333; }
    .input-area input { flex: 1; padding: 0.75rem; border: 1px solid #333; border-radius: 4px; background: #16213e; color: #eee; font-size: 1rem; }
    .input-area input:focus { outline: none; border-color: #e94560; }
    .login-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    .login-container p { color: #888; }
    .status { font-size: 0.8rem; color: #888; }
    .error { color: #e94560; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Iteration 0: Direct AgentCore</h1>
    <div>
      <span id="userInfo" class="status"></span>
      <button id="authBtn" class="btn btn-primary" onclick="handleAuth()">Login</button>
    </div>
  </div>

  <div id="loginView" class="login-container">
    <h2>Welcome</h2>
    <p>Login with Cognito to chat with the agent</p>
    <button class="btn btn-primary" onclick="handleAuth()">Login with Cognito</button>
  </div>

  <div id="chatView" class="container" style="display: none;">
    <div id="messages" class="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION - Update agentRuntimeArn after deploying agent
    // ============================================================
    const CONFIG = {
      // Cognito settings - UPDATE THESE for your account
      // Remove https:// from the Cognito domain
      cognitoDomain: 'apigw-agentcore-<YOUR_ACCOUNT_ID>.auth.<YOUR_REGION>.amazoncognito.com',
      clientId: '<YOUR_CLIENT_ID>',
      redirectUri: 'http://localhost:8000',
      
      // AgentCore Runtime ARN - UPDATE THIS after running: agentcore deploy
      // Copy the ARN from the deploy output
      agentRuntimeArn: 'arn:aws:bedrock-agentcore:<YOUR_REGION>:<YOUR_ACCOUNT_ID>:runtime/<YOUR_AGENT_RUNTIME_ID>'
    };

    // Build the endpoint URL from the ARN
    function getAgentEndpoint() {
      const arn = CONFIG.agentRuntimeArn;
      const region = arn.split(':')[3];
      const encodedArn = encodeURIComponent(arn);
      return `https://bedrock-agentcore.${region}.amazonaws.com/runtimes/${encodedArn}/invocations`;
    }

    // ============================================================
    // AUTH STATE
    // ============================================================
    let accessToken = null;
    let idToken = null;

    // ============================================================
    // COGNITO AUTH
    // ============================================================
    function handleAuth() {
      if (accessToken) {
        // Logout
        accessToken = null;
        idToken = null;
        sessionStorage.clear();
        updateUI();
      } else {
        // Login - redirect to Cognito Hosted UI
        const authUrl = `https://${CONFIG.cognitoDomain}/oauth2/authorize?` +
          `client_id=${CONFIG.clientId}&` +
          `response_type=code&` +
          `scope=openid+profile&` +
          `redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}`;
        window.location.href = authUrl;
      }
    }

    async function exchangeCodeForTokens(code) {
      const tokenUrl = `https://${CONFIG.cognitoDomain}/oauth2/token`;
      
      const params = new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: CONFIG.clientId,
        code: code,
        redirect_uri: CONFIG.redirectUri
      });

      try {
        const response = await fetch(tokenUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        if (!response.ok) throw new Error('Token exchange failed');
        
        const tokens = await response.json();
        accessToken = tokens.access_token;
        idToken = tokens.id_token;
        
        // Store in session
        sessionStorage.setItem('accessToken', accessToken);
        sessionStorage.setItem('idToken', idToken);
        
        // Clean URL
        window.history.replaceState({}, document.title, CONFIG.redirectUri);
        
        updateUI();
      } catch (error) {
        console.error('Token exchange error:', error);
        addMessage('Error: Failed to authenticate. Check console.', 'assistant error');
      }
    }

    // ============================================================
    // CHAT
    // ============================================================
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message || !accessToken) return;

      input.value = '';
      addMessage(message, 'user');

      try {
        const response = await fetch(getAgentEndpoint(), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`
          },
          body: JSON.stringify({ prompt: message })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }

        const data = await response.json();
        addMessage(data.response, 'assistant');
      } catch (error) {
        console.error('Chat error:', error);
        addMessage(`Error: ${error.message}`, 'assistant error');
      }
    }

    function addMessage(text, type) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // ============================================================
    // UI
    // ============================================================
    function updateUI() {
      const loginView = document.getElementById('loginView');
      const chatView = document.getElementById('chatView');
      const authBtn = document.getElementById('authBtn');
      const userInfo = document.getElementById('userInfo');

      if (accessToken) {
        loginView.style.display = 'none';
        chatView.style.display = 'flex';
        authBtn.textContent = 'Logout';
        
        // Decode JWT to get user info
        try {
          const payload = JSON.parse(atob(idToken.split('.')[1]));
          userInfo.textContent = payload.email || payload.sub || 'Logged in';
        } catch {
          userInfo.textContent = 'Logged in';
        }
      } else {
        loginView.style.display = 'flex';
        chatView.style.display = 'none';
        authBtn.textContent = 'Login';
        userInfo.textContent = '';
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      // Check for auth code in URL
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      
      if (code) {
        exchangeCodeForTokens(code);
        return;
      }

      // Check for stored tokens
      accessToken = sessionStorage.getItem('accessToken');
      idToken = sessionStorage.getItem('idToken');
      
      updateUI();
    }

    init();
  </script>
</body>
</html>
