[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apigw-agent"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "bedrock-agentcore >= 1.0.3",
    "langchain-aws >= 0.2.0",
    "langchain-core >= 0.3.0",
    "boto3 >= 1.40.0",
]
